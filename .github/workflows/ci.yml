name: NecroKernel-OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine-tests:
    name: Engine & Reanimation Invariant Tests (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Reanimation Suite
        run: |
          python -m pytest -v --tb=short test_reanimation_cycle.py

      - name: Run Recovery Benchmark Smoke Test
        run: |
          python -m engine.server &
          sleep 2
          python scripts/measure_recovery.py 10

  dashboard-build:
    name: Next.js Dashboard Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm install

      - name: Build Next.js Dashboard
        run: |
          cd dashboard
          npm run build
